[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-harness"
version = "0.9.0"
description = "A recoverable, governable and evolvable Agent Runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AtlasHarness Contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
# The runtime is a library and a CLI first. A web framework is only needed by
# whoever actually serves the HTTP transport, so it stays out of the base install.
http = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
atlas = "atlas_harness.transport.cli:main"

[dependency-groups]
dev = [
  "fastapi>=0.115,<1",
  "hypothesis>=6.100,<7",
  "mypy>=1.13,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-pyyaml>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_harness"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "performance: scale checks that run at a milestone boundary rather than in the per-PR gate",
    "live: sends a real request to a configured provider; skipped unless credentials are present",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI defaults by calling Option/Argument in the signature. The
# returned descriptors are never mutated, so B008 does not apply to them.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true

[tool.uv]
default-groups = ["dev"]
